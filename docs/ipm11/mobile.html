  fsButton.addEventListener('click', toggleFullScreen);
  document.addEventListener('fullscreenchange', () => {
    const on = !!document.fullscreenElement;
    fsButton.setAttribute('aria-pressed', on ? 'true' : 'false');
    fsButton.title = on ? 'leave full screen (F)' : 'full screen (F)';
  });
}

const slide = document.getElementById('slide');
const where = document.getElementById('where');
const prev = document.getElementById('prev');
const next = document.getElementById('next');
const mode = document.getElementById('mode');
const menu = document.getElementById('menu');
const sheet = document.getElementById('sheet');
let cur = VIEWS[0];

// a phone held upright gets the tall slide, one on its side the wide one
function src(v) {
  return 'slide/' + v.key + (innerHeight >= innerWidth ? '.tall' : '.wide') + '.m.svg';
}
function at(d) {
  const n = VIEWS.length;
  return VIEWS[(VIEWS.indexOf(cur) + d + n) % n];
}

function show(v) {
  cur = v;
  if (slide.getAttribute('src') !== src(v)) slide.src = src(v);
  slide.alt = v.alt;
  where.innerHTML = LABELS[v.key] + '<span class="pos">' + (VIEWS.indexOf(v) + 1) + '/' + VIEWS.length + '</span>';
  prev.href = '#' + at(-1).anchor;
  next.href = '#' + at(1).anchor;
  mode.href = 'index.html#' + v.anchor;
  for (const a of sheet.querySelectorAll('a.tab[data-key]')) {
    a.setAttribute('aria-current', a.dataset.key === v.key ? 'true' : 'false');
  }
  // the neighbours load ahead, so a step swaps the slide at once
  for (const d of [-1, 1]) new Image().src = src(at(d));
}

// steps replace the address: the back gesture leaves the page, it does not
// rewind it slide by slide
function go(anchor) { location.replace('#' + anchor); }
function step(d) { go(at(d).anchor); }
function openSheet(open) {
  sheet.hidden = !open;
  menu.setAttribute('aria-expanded', open ? 'true' : 'false');
  if (open) document.body.classList.remove('bare');
}
// while pinch-zoomed in, taps and swipes pan the slide instead of stepping
function zoomed() { return !!window.visualViewport && visualViewport.scale > 1.01; }

menu.addEventListener('click', () => openSheet(sheet.hidden));
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');
  if (a) {
    e.preventDefault();
    openSheet(false);
    go(a.getAttribute('href').slice(1));
    return;
  }
  if (e.target.closest('a, button, .dock, .sheet')) return;
  if (!sheet.hidden) { openSheet(false); return; }
  if (zoomed()) return;
  const x = e.clientX / innerWidth;
  if (x < 0.3) step(-1);
  else if (x > 0.7) step(1);
  else document.body.classList.toggle('bare');
});

let touch = null;
addEventListener('touchstart', e => {
  touch = e.touches.length === 1 && !e.target.closest('.sheet')
    ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null;
}, { passive: true });
addEventListener('touchend', e => {
  if (!touch || zoomed()) return;
  const t = e.changedTouches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y;
  touch = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > 2 * Math.abs(dy)) step(dx < 0 ? 1 : -1);
}, { passive: true });

document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
  if (e.key === 'Escape') openSheet(false);
  if (e.key === 'f' || e.key === 'F') toggleFullScreen();
});
addEventListener('resize', () => show(cur));
addEventListener('hashchange', () => show(resolve(location.hash)));
show(resolve(location.hash));
</script>
</body>
</html>

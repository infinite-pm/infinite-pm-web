const slide = document.getElementById('slide');

const prev = document.getElementById('prev');
const next = document.getElementById('next');

const maxed = document.body.classList.contains('maxed');

// a fragment names a view by its anchor (#eLe2, #part-of), its slide key, or an

function resolve(hash) {
  const h = decodeURIComponent(hash.replace(/^#/, ''));
  return VIEWS.find(v => v.anchor === h) || VIEWS.find(v => v.key === h) ||
    VIEWS.find(v => v.old.includes(h)) || VIEWS.find(v => v.key === 'all');
}

function show(v) {
  slide.src = 'slide/' + v.key + '.svg';
  slide.alt = v.alt;
  if (count) count.textContent = v.count;
  // previous / next walk the links in page order and wrap around
  const i = VIEWS.indexOf(v), n = VIEWS.length;
  prev.href = '#' + VIEWS[(i - 1 + n) % n].anchor;
  next.href = '#' + VIEWS[(i + 1) % n].anchor;
  // the full-screen icon opens the other page on the same view
  mode.href = mode.dataset.page + '#' + v.anchor;
  for (const a of document.querySelectorAll('a.tab[data-key]')) {
    a.setAttribute('aria-current', a.dataset.key === v.key ? 'true' : 'false');
  }
}

// maxed.html fits the slide to the window. Fitting with CSS alone would re-fit it
// on every browser zoom, so zoom would only grow the buttons; instead the fit is
// scaled by how far the zoom has moved since the page loaded (devicePixelRatio
// changes with zoom, not with window size), and the stage scrolls when it grows.
const stage = document.querySelector('.stage');
const dpr0 = window.devicePixelRatio || 1;
function fitSlide() {
  if (!stage) return;
  const fit = Math.min(stage.clientWidth, stage.clientHeight * 16 / 9);
  const zoom = (window.devicePixelRatio || 1) / dpr0;
  stage.firstElementChild.style.width = Math.floor(fit * zoom) + 'px';
}
addEventListener('resize', fitSlide);
fitSlide();

addEventListener('hashchange', () => show(resolve(location.hash)));

// Escape leaves maxed.html — but not while the browser is in full screen, where
// Escape belongs to the browser: navigating then would swallow the key the
// reader pressed to get out of full screen. Full screen is the page's own
// (Fullscreen API), the browser's (F11, which Chromium reports as display-mode
// fullscreen), or failing both, a window exactly as large as the screen.
function inFullScreen() {
  return !!document.fullscreenElement ||
    matchMedia('(display-mode: fullscreen)').matches ||
    (outerWidth >= screen.width && outerHeight >= screen.height);
}
document.addEventListener('keydown', e => {

  if (e.key === 'ArrowLeft') location.hash = prev.getAttribute('href');

  if (e.key === 'Escape' && maxed && !inFullScreen()) location.href = mode.href;
});
show(resolve(location.hash));
